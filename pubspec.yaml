name: ecommerce_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.2
  rxdart: ^0.28.0
  fluttertoast: ^8.2.12
  http: ^1.4.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  equatable: ^2.0.7
